<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Crown Planner</title>
<meta name="description" content="Plan it, slay it. Hair style recipes, shopping list and planner.">
<meta name="theme-color" content="#f8efe5">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta property="og:title" content="Crown Planner">
<meta property="og:description" content="A beautiful home for your natural-hair routines, styles, and plans.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://danielledorley.github.io/crown-planner/">
<meta property="og:image" content="https://danielledorley.github.io/crown-planner/icon.svg?v=3">
<meta name="twitter:card" content="summary">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg?v=2" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg?v=3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Crown Planner">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --ink:#22504b; --ink-soft:#5f8b86; --line:#bfe3da;
  --sea1:#e8f7f3; --sea2:#c9ece3; --sea3:#94d6c7; --sea4:#58b0a2; --sea5:#3a8c80;
  --gold:#d4af37; --gold-dk:#9f7a1a; --gold-lt:#f7e7a6;
  --lilac:#e9e0f8; --blush:#fbe6ee;
  --glass:rgba(255,255,255,.58); --glass-brd:rgba(255,255,255,.9);
  --gold-grad:linear-gradient(120deg,#9f7a1a 0%,#e9cf73 22%,#fff4c8 38%,#d4af37 55%,#f7e7a6 72%,#b08a22 100%);
  --sea-grad:linear-gradient(180deg,#b6eadf 0%,#7fcbbb 55%,#5fb5a6 100%);
  --holo:linear-gradient(110deg,#c9ece3,#e9e0f8,#fbe6ee,#f7e7a6,#c9ece3);
  --radius:24px; --shadow:0 10px 28px rgba(34,80,75,.13);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0}
body{
  font-family:'Quicksand',system-ui,-apple-system,sans-serif;color:var(--ink);min-height:100vh;
  background:
    radial-gradient(900px 520px at 0% -8%,#ffffff 0%,transparent 60%),
    radial-gradient(700px 520px at 105% 6%,var(--lilac) 0%,transparent 58%),
    radial-gradient(800px 640px at -12% 96%,var(--sea2) 0%,transparent 60%),
    radial-gradient(600px 420px at 110% 90%,var(--blush) 0%,transparent 60%),
    linear-gradient(165deg,#ecf8f5 0%,#d6f0e9 50%,#e9f5f7 100%);
  background-attachment:fixed;
  padding-bottom:calc(104px + env(safe-area-inset-bottom));
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.sparkles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.sparkles span{position:absolute;color:#fff;opacity:0;text-shadow:0 0 6px var(--gold-lt),0 0 14px #fff;animation:tw 3.6s infinite ease-in-out}
@keyframes tw{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:.95;transform:scale(1) rotate(25deg)}}
@media (prefers-reduced-motion:reduce){.sparkles span{animation:none;opacity:.5}*{transition:none!important}}

.wrap{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:0 16px}
header.top{text-align:center;padding:calc(18px + env(safe-area-inset-top)) 0 6px}
.logo{font-family:'Great Vibes',cursive;font-weight:400;font-size:52px;line-height:1.05;margin:0;
  background:var(--gold-grad);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 0 rgba(255,255,255,.9)) drop-shadow(0 4px 10px rgba(159,122,26,.25));animation:shine 6s linear infinite}
@keyframes shine{to{background-position:200% 0}}
.tag{margin:0;font-size:11px;letter-spacing:.38em;text-transform:uppercase;color:var(--sea5);font-weight:700}

.script{font-family:'Great Vibes',cursive;font-weight:400;font-size:38px;line-height:1.1;margin:2px 0 6px;
  background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 1px 0 #fff)}
.eyebrow{font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;font-weight:700;color:var(--sea5)}
.muted{color:var(--ink-soft);font-size:14.5px;margin:4px 0 14px;line-height:1.45}
.hint{color:var(--ink-soft);font-size:12.5px;margin:6px 2px 0}
.empty{text-align:center;color:var(--ink-soft);padding:22px 8px;font-size:14.5px}

.card{position:relative;background:var(--glass);backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px) saturate(150%);
  border:1px solid var(--glass-brd);border-radius:var(--radius);box-shadow:var(--shadow),inset 0 1px 0 #fff;padding:18px;margin:14px 0}
.goldline::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.6px;background:var(--gold-grad);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.hero{text-align:center;overflow:hidden}
.hero::after{content:"✦";position:absolute;right:16px;top:12px;color:var(--gold);font-size:18px;opacity:.8}

.sec-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 10px}
.sec-title h3{margin:0;font-size:15px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--sea5)}
.sec-title h3::before{content:"✦ ";color:var(--gold)}

/* buttons */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 20px;border-radius:999px;
  font-weight:700;font-size:15px;color:#fff;background:var(--sea-grad);border:1px solid rgba(255,255,255,.7);
  box-shadow:0 6px 16px rgba(58,140,128,.35),inset 0 -3px 6px rgba(34,80,75,.2),inset 0 2px 0 rgba(255,255,255,.7);
  text-shadow:0 1px 1px rgba(34,80,75,.35);overflow:hidden;transition:transform .12s}
.btn::before{content:"";position:absolute;left:8%;right:8%;top:2px;height:45%;border-radius:999px;background:linear-gradient(rgba(255,255,255,.75),rgba(255,255,255,0));pointer-events:none}
.btn:active{transform:scale(.97)}
.btn.gold{background:linear-gradient(180deg,#fff3c4 0%,#e6c65c 45%,#c79b2a 100%);color:#4a3606;text-shadow:0 1px 0 rgba(255,255,255,.6);
  box-shadow:0 6px 16px rgba(159,122,26,.35),inset 0 -3px 6px rgba(120,86,10,.25),inset 0 2px 0 rgba(255,255,255,.8)}
.btn.ghost{background:rgba(255,255,255,.6);color:var(--ink);text-shadow:none;border:1.5px solid var(--line);box-shadow:none}
.btn.ghost::before{display:none}
.btn.danger{color:#b4475f;border-color:#f2c6d1}
.btn.sm{padding:8px 14px;font-size:13.5px}
.btn.block{width:100%}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.x{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;color:var(--ink-soft);font-size:14px;flex:none}
.x:active{background:rgba(255,255,255,.7)}
.x.sm{width:26px;height:26px;font-size:12px}
.icon-btn{width:40px;height:40px;border-radius:50%;display:inline-grid;place-items:center;background:rgba(255,255,255,.65);border:1px solid var(--glass-brd);box-shadow:var(--shadow);font-size:17px}

/* chips */
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700;
  background:var(--holo);background-size:300% 100%;border:1px solid rgba(255,255,255,.9);color:var(--ink);white-space:nowrap}
.chip.gold{background:linear-gradient(180deg,#fff7d6,#f3dc8c);color:#6b5010;border-color:#f0dc9a}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.tmpl{flex:none;padding:9px 14px;border-radius:999px;background:rgba(255,255,255,.7);border:1px solid var(--glass-brd);font-weight:600;font-size:13.5px;box-shadow:0 3px 10px rgba(34,80,75,.08)}
.tmpl:active{background:#fff}

/* checks */
.check{width:26px;height:26px;border-radius:50%;flex:none;border:2px solid var(--gold);background:rgba(255,255,255,.8);display:grid;place-items:center;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.08);transition:all .15s}
.check.on{background:linear-gradient(180deg,#fff3c4,#d4af37);border-color:#c79b2a;box-shadow:0 0 0 3px rgba(247,231,166,.6)}
.check.on::after{content:"✓";font-weight:700;font-size:14px;color:#4a3606}

/* rows */
.item{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px dashed var(--line)}
.item:last-child{border-bottom:0}
.item .iname{flex:1;font-weight:600;font-size:15px;line-height:1.3}
.item .sub{display:block;font-size:12px;font-weight:500;color:var(--ink-soft)}
.item.have .iname,.item.done .iname{color:var(--ink-soft);text-decoration:line-through;text-decoration-color:var(--gold)}
.group-label{font-size:12px;font-weight:700;color:var(--ink-soft);margin:12px 0 2px;letter-spacing:.06em}

/* forms */
.fld{display:block;margin:10px 0}
.fld>span{display:block;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--sea5);margin:0 0 5px 4px}
input[type=text],input[type=url],input[type=date],input[type=time],input[type=number],input:not([type]),select,textarea{
  width:100%;padding:12px 14px;border-radius:16px;border:1.5px solid var(--line);background:rgba(255,255,255,.85);font-size:16px;outline:none;
  box-shadow:inset 0 1px 2px rgba(34,80,75,.06);-webkit-appearance:none;appearance:none;min-height:46px}
select{background-image:linear-gradient(45deg,transparent 50%,var(--sea5) 50%),linear-gradient(135deg,var(--sea5) 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(247,231,166,.55)}
textarea{resize:vertical;min-height:70px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2 .fld{margin:6px 0}
.add-row{display:flex;gap:8px;margin-top:10px}
.add-row input{flex:1;min-width:0}
.add-row select{width:auto;flex:none}
.add-row .btn{flex:none;padding:10px 16px}
.switch{display:flex;align-items:center;gap:10px;margin:12px 2px;font-weight:600;font-size:15px;cursor:pointer}
.switch input{position:absolute;opacity:0;pointer-events:none}
.switch .track{width:48px;height:28px;border-radius:999px;background:#dfeeea;border:1.5px solid var(--line);position:relative;flex:none;transition:all .2s}
.switch .track::after{content:"";position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.18);transition:all .2s}
.switch input:checked+.track{background:linear-gradient(180deg,#fff3c4,#d4af37);border-color:#c79b2a}
.switch input:checked+.track::after{left:22px}
.emojis{display:flex;flex-wrap:wrap;gap:6px}
.emo input{position:absolute;opacity:0}
.emo span{display:grid;place-items:center;width:42px;height:42px;border-radius:14px;font-size:21px;background:rgba(255,255,255,.7);border:1.5px solid var(--line);cursor:pointer}
.emo input:checked+span{border-color:var(--gold);box-shadow:0 0 0 3px rgba(247,231,166,.7);background:#fff}

/* style grid */
.style-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0}
.style-card{text-align:left;border-radius:var(--radius);overflow:hidden;background:var(--glass);border:1px solid var(--glass-brd);box-shadow:var(--shadow);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);position:relative;transition:transform .15s}
.style-card:active{transform:scale(.98)}
.cover{aspect-ratio:4/5;position:relative;display:grid;place-items:center;overflow:hidden;
  background:linear-gradient(150deg,#d5f2ea 0%,#a7dfd2 45%,#e9e0f8 80%,#fbe6ee 100%)}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,0) 35%);pointer-events:none}
.cover-emoji{font-size:58px;filter:drop-shadow(0 6px 10px rgba(34,80,75,.25))}
.sc-body{padding:10px 12px 12px}
.sc-name{font-weight:700;font-size:15.5px;line-height:1.25}
.sc-meta{font-size:11.5px;color:var(--ink-soft);margin-top:3px;font-weight:600}

/* detail */
.detail-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:10px 0 0}
.back{font-weight:700;color:var(--sea5);font-size:15px;padding:8px 4px}
.detail-hero{text-align:center;padding-top:22px}
.detail-hero .big-emoji{font-size:44px;display:block}
.notes{white-space:pre-wrap;font-size:14.5px;line-height:1.5;color:var(--ink);margin:6px 0 0}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.photos button{aspect-ratio:1;border-radius:16px;overflow:hidden;position:relative;background:var(--sea2);border:2px solid #fff;box-shadow:0 4px 10px rgba(34,80,75,.12)}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.add-photo{aspect-ratio:1;border-radius:16px;border:2px dashed var(--gold);display:grid;place-items:center;text-align:center;font-size:12.5px;font-weight:700;color:var(--gold-dk);background:rgba(255,255,255,.5);cursor:pointer;padding:6px}
.add-photo input{display:none}
.add-photo b{display:block;font-size:24px}
.steps{margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line)}
.steps li:last-child{border-bottom:0}
.steps li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:#4a3606;background:linear-gradient(180deg,#fff3c4,#e2bf50)}
.steps li span{flex:1;font-size:15px;line-height:1.4;padding-top:3px}
.video{background:rgba(255,255,255,.6);border:1px solid var(--glass-brd);border-radius:18px;padding:10px;margin:10px 0}
.vhead{display:flex;align-items:center;gap:8px}
.vtitle{flex:1;font-weight:600;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:999px;color:#fff;flex:none}
.badge.youtube{background:#e04a5f}.badge.tiktok{background:#1f2a2a}.badge.instagram{background:linear-gradient(90deg,#f6a04d,#d6457a,#8a54c9)}
.badge.pinterest{background:#c8324a}.badge.link{background:var(--sea4)}
.vframe{margin-top:8px;border-radius:14px;overflow:hidden;background:linear-gradient(150deg,#d5f2ea,#e9e0f8);display:grid;place-items:center;aspect-ratio:16/9}
.vframe.tiktok,.vframe.instagram{aspect-ratio:9/14;max-height:640px}
.vframe.pinterest{aspect-ratio:3/5;max-height:620px}
.vframe iframe{width:100%;height:100%;border:0;display:block}
.play{padding:12px 20px;border-radius:999px;font-weight:700;background:rgba(255,255,255,.85);box-shadow:var(--shadow)}
.vlink{display:inline-block;margin-top:8px;font-size:13px;font-weight:700;color:var(--sea5);text-decoration:none}

/* planner */
.status{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:18px;background:rgba(255,255,255,.65);border:1px solid var(--glass-brd);margin:12px 0;font-size:14px;font-weight:600}
.status .dot{width:10px;height:10px;border-radius:50%;background:#e2a0b0;box-shadow:0 0 0 4px rgba(226,160,176,.25);flex:none}
.status.on .dot{background:#4fbf9f;box-shadow:0 0 0 4px rgba(79,191,159,.25)}
.status span{flex:1}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-head h3{margin:0;font-family:'Great Vibes',cursive;font-weight:400;font-size:32px;background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.wk,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wk div{text-align:center;font-size:10.5px;font-weight:700;letter-spacing:.1em;color:var(--ink-soft);padding:4px 0}
.day{aspect-ratio:1;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:600;font-size:14.5px;background:rgba(255,255,255,.45);border:1px solid transparent}
.day.out{opacity:.35}
.day.today{border:1.5px solid var(--gold);background:rgba(255,247,214,.7)}
.day.sel{background:var(--sea-grad);color:#fff;text-shadow:0 1px 1px rgba(34,80,75,.35);box-shadow:0 4px 12px rgba(58,140,128,.35)}
.dots{display:flex;gap:2px;height:5px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--gold)}
.dots i.done{background:var(--sea4)}
.day.sel .dots i{background:#fff3c4}
.task{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px dashed var(--line)}
.task:last-child{border-bottom:0}
.task .tbody{flex:1;min-width:0;text-align:left}
.task .ttitle{font-weight:700;font-size:15px;line-height:1.3}
.task .tmeta{font-size:12px;color:var(--ink-soft);font-weight:600;margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.task.done .ttitle{text-decoration:line-through;color:var(--ink-soft);text-decoration-color:var(--gold)}
.day-head{font-weight:700;font-size:13px;color:var(--sea5);letter-spacing:.06em;margin:14px 0 2px;text-transform:uppercase}

/* Sasha stylist */
.sasha-hero{display:grid;grid-template-columns:78px 1fr;gap:14px;align-items:center;padding:16px;background:linear-gradient(125deg,rgba(255,255,255,.82),rgba(201,236,227,.72),rgba(247,231,166,.48))}
.sasha-avatar{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 25%,#8e523c 0%,#5a2d22 56%,#2d1918 100%);border:3px solid #e5c45e;box-shadow:0 0 0 4px rgba(255,255,255,.7),0 6px 15px rgba(75,39,29,.18);font-size:39px;position:relative}
.sasha-avatar:after{content:'✦';position:absolute;right:-4px;top:-5px;color:var(--gold);font-size:20px;text-shadow:0 1px #fff}
.sasha-title{font-size:28px;margin:0;color:#6d3a2e;font-weight:800;letter-spacing:-.04em}
.sasha-sub{font-size:12px;font-weight:700;color:var(--sea5);letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.sasha-chat{display:flex;flex-direction:column;gap:12px;min-height:180px;max-height:48vh;overflow:auto;padding:4px 1px 12px;scroll-behavior:smooth}
.sasha-msg{max-width:91%;padding:12px 14px;border-radius:18px;font-size:14px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.sasha-msg.bot{align-self:flex-start;background:rgba(255,255,255,.88);border:1px solid #d9eee8;border-bottom-left-radius:5px}
.sasha-msg.user{align-self:flex-end;background:linear-gradient(145deg,#d8f2eb,#b8e5d9);border:1px solid #a5d9cc;border-bottom-right-radius:5px}
.sasha-prompts{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 12px}
.sasha-prompts button{padding:8px 11px;border-radius:999px;border:1px solid #d9c36e;background:rgba(255,255,255,.75);font-size:12px;font-weight:700;text-align:left}
.sasha-compose{display:flex;align-items:flex-end;gap:8px;padding-top:10px;border-top:1px solid var(--line)}
.sasha-compose textarea{min-height:46px;max-height:110px;flex:1;padding:12px;border-radius:18px}
.sasha-note{font-size:11px;line-height:1.4;color:var(--ink-soft);margin:9px 2px 0}
@media(max-width:380px){.sasha-hero{grid-template-columns:64px 1fr;gap:11px}.sasha-avatar{width:62px;height:62px;font-size:32px}.sasha-title{font-size:25px}}

/* tabs */
nav.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));z-index:20;width:min(620px,calc(100% - 20px));
  display:grid;grid-template-columns:repeat(5,1fr);padding:7px;border-radius:28px;background:rgba(255,255,255,.72);
  backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);border:1px solid #fff;box-shadow:0 12px 30px rgba(34,80,75,.2)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;border-radius:21px;font-size:11px;font-weight:700;color:var(--ink-soft);letter-spacing:.04em}
.tabs button b{font-size:21px;line-height:1;font-weight:400}

/* ---------- helpers ---------- */

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const pad = n => String(n).padStart(2, '0');
const dstr = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const pdate = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const today = () => dstr(new Date());
const addDays = (s, n) => { const d = pdate(s); d.setDate(d.getDate() + n); return dstr(d); };
const fmtDate = (s, o = { weekday: 'short', month: 'short', day: 'numeric' }) => pdate(s).toLocaleDateString(undefined, o);

const photoCache = new Map();
const DB = {
  p: null,
  open() {
    return this.p || (this.p = new Promise((res, rej) => {
      const r = indexedDB.open('crownPlanner', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('photos');
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    }));
  },
  async tx(mode, fn) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const t = db.transaction('photos', mode);
      const req = fn(t.objectStore('photos'));
      t.oncomplete = () => res(req && req.result);
      t.onerror = () => rej(t.error);
    });
  },
  get(k) { return this.tx('readonly', s => s.get(k)); },
  put(k, v) { return this.tx('readwrite', s => s.put(v, k)); },
  del(k) { return this.tx('readwrite', s => s.delete(k)); }
};
async function hydrate() {

    if (src && img.src !== src) img.src = src;

}
function fileToDataURL(file, max = 1080) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const im = new Image();
    im.onload = () => {
      const sc = Math.min(1, max / Math.max(im.width, im.height));
      const c = document.createElement('canvas');
      c.width = Math.round(im.width * sc); c.height = Math.round(im.height * sc);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.82));
    };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Could not read that photo')); };
    im.src = url;
  });
}

function parseVideo(raw) {
  let u; try { u = new URL(String(raw).trim()); } catch (e) { return null; }
  if (!/^https?:$/.test(u.protocol)) return null;
  const h = u.hostname.replace(/^(www|m|vm|vt)\./, '');
  const url = u.href; let m;
  if (h === 'youtu.be') { const id = u.pathname.slice(1).split('/')[0]; if (id) return { platform: 'youtube', url, embed: `https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}?autoplay=1&playsinline=1&rel=0` }; }
  if (h.endsWith('youtube.com')) {
    const id = u.searchParams.get('v') || ((m = u.pathname.match(/\/(shorts|embed|live)\/([\w-]+)/)) && m[2]);
    if (id) return { platform: 'youtube', url, embed: `https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}?autoplay=1&playsinline=1&rel=0` };
    return { platform: 'youtube', url };
  }
  if (h.endsWith('tiktok.com')) {
    if ((m = u.pathname.match(/\/video\/(\d+)/))) return { platform: 'tiktok', url, embed: `https://www.tiktok.com/embed/v2/${m[1]}` };
    return { platform: 'tiktok', url };
  }
  if (h.endsWith('instagram.com')) {
    if ((m = u.pathname.match(/\/(p|reel|reels|tv)\/([\w-]+)/))) return { platform: 'instagram', url, embed: `https://www.instagram.com/${m[1] === 'reels' ? 'reel' : m[1]}/${m[2]}/embed` };
    return { platform: 'instagram', url };
  }
  if (h.includes('pinterest.') || h === 'pin.it') {
    if ((m = u.pathname.match(/\/pin\/(\d+)/))) return { platform: 'pinterest', url, embed: `https://assets.pinterest.com/ext/embed.html?id=${m[1]}` };
    return { platform: 'pinterest', url };
  }
  return { platform: 'link', url };
}

function occursOn(t, ds) {
  if (ds < t.date) return false;
  if (ds === t.date) return true;
  const r = REPEATS[t.repeat];
  if (!r || !r.freq) return false;
  if (r.freq === 'WEEKLY') return Math.round((pdate(ds) - pdate(t.date)) / 864e5) % r.days === 0;
  if (r.freq === 'MONTHLY') return pdate(ds).getDate() === pdate(t.date).getDate();
  return false;
}
const tasksOn = ds => S.tasks.filter(t => occursOn(t, ds)).sort((a, b) => (a.allDay === b.allDay ? (a.time || '').localeCompare(b.time || '') : a.allDay ? -1 : 1));

function nextOcc(t, from = today()) {
  for (let i = 0; i < 400; i++) { const d = addDays(from, i); if (occursOn(t, d)) return d; }
  return null;
}
function nextForStyle(sid) {

const gisLoaded = () => !!(window.google && google.accounts && google.accounts.oauth2);
const gReady = () => !!(tok && Date.now() < tokExp - 60000);

function getToken() {
  return new Promise((res, rej) => {
    if (gReady()) return res(tok);
    const cid = (S.settings.clientId || '').trim();
    if (!cid) return rej(new Error('Add your Google Client ID in Settings first'));
    if (!gisLoaded()) return rej(new Error('Google sign-in is still loading — try again in a sec'));
    if (!tokenClient || tokenCid !== cid) {
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: cid, scope: SCOPE,
        callback: r => {
          const p = pending; pending = null; if (!p) return;
          if (r.error) return p.rej(new Error(r.error_description || r.error));
          tok = r.access_token; tokExp = Date.now() + (Number(r.expires_in) || 3600) * 1000;
          try { sessionStorage.setItem('cp.tok', JSON.stringify({ tok, exp: tokExp })); } catch (e) {}
          if (!S.settings.gLinked) { S.settings.gLinked = true; save(); }
          p.res(tok);
        },
        error_callback: e => {
          const p = pending; pending = null; if (!p) return;
          p.rej(new Error(e && e.type === 'popup_closed' ? 'Google sign-in was closed' : 'Google sign-in could not open — allow pop-ups and try again'));
        }
      });
      tokenCid = cid;
    }
    pending = { res, rej };
    tokenClient.requestAccessToken({ prompt: S.settings.gLinked ? '' : 'consent' });
  });
}
async function gApi(method, path, body) {
  const t = await getToken();
  const r = await fetch('https://www.googleapis.com/calendar/v3' + path, {
    method, headers: { Authorization: 'Bearer ' + t, 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined
  });
  if (r.status === 401) { tok = null; try { sessionStorage.removeItem('cp.tok'); } catch (e) {} throw new Error('Google session expired — tap sync again'); }
  if (r.status === 204) return null;
  if (!r.ok) { let msg = r.statusText; try { msg = (await r.json()).error.message; } catch (e) {} const err = new Error(msg); err.status = r.status; throw err; }
  return r.json();
}
const calPath = () => '/calendars/' + encodeURIComponent((S.settings.calendarId || 'primary').trim()) + '/events';
function endOf(date, time, mins) {
  const [y, m, d] = date.split('-').map(Number); const [h, mi] = time.split(':').map(Number);
  const e = new Date(y, m - 1, d, h, mi + mins);
  return `${dstr(e)}T${pad(e.getHours())}:${pad(e.getMinutes())}:00`;
}
function toEvent(t) {
  const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
  const st = getStyle(t.styleId);
  const desc = [];
  if (t.notes) desc.push(t.notes);
  if (st) {
    desc.push(`Style: ${st.emoji || ''} ${st.name}`);
    if (st.items.length) desc.push('You’ll need:\n' + st.items.map(i => `${i.have ? '✓' : '•'} ${i.name}`).join('\n'));
  }
  desc.push('✦ from Crown Planner');
  const ev = { summary: t.title, description: desc.join('\n\n'), colorId: '7' };
  if (t.allDay) { ev.start = { date: t.date }; ev.end = { date: addDays(t.date, 1) }; }
  else { ev.start = { dateTime: `${t.date}T${t.time}:00`, timeZone: tz }; ev.end = { dateTime: endOf(t.date, t.time, t.duration || 60), timeZone: tz }; }

  if (r && r.freq) ev.recurrence = [`RRULE:FREQ=${r.freq};INTERVAL=${r.n}`];
  ev.reminders = t.reminder < 0 ? { useDefault: true } : { useDefault: false, overrides: t.reminder > 0 ? [{ method: 'popup', minutes: t.reminder }] : [] };

}
async function syncTask(t, quiet) {

function viewMonth() {
  const [y, m] = ui.month.split('-').map(Number);
  const first = new Date(y, m - 1, 1);
  const dim = new Date(y, m, 0).getDate();
  const weeks = Math.ceil((first.getDay() + dim) / 7);
  const start = new Date(y, m - 1, 1 - first.getDay());
  const td = today();
  let cells = '';
  for (let i = 0; i < weeks * 7; i++) {
    const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
    const ds = dstr(d);
    const items = tasksOn(ds);
    const dots = items.slice(0, 3).map(t => `<i class="${isDone(t, ds) ? 'done' : ''}"></i>`).join('');
    cells += `<button class="day ${d.getMonth() !== m - 1 ? 'out' : ''} ${ds === td ? 'today' : ''} ${ds === ui.day ? 'sel' : ''}" data-act="pick-day" data-id="${ds}" aria-label="${fmtDate(ds)}"><span>${d.getDate()}</span><b class="dots">${dots}</b></button>`;
  }
  const wk = ['S', 'M', 'T', 'W', 'T', 'F', 'S'].map(x => `<div>${x}</div>`).join('');
  return `<div class="cal-head">
      <button class="icon-btn" aria-label="Previous month" data-act="cal-prev">‹</button>
      <h3>${first.toLocaleDateString(undefined, { month: 'long', year: 'numeric' })}</h3>
      <button class="icon-btn" aria-label="Next month" data-act="cal-next">›</button>
    </div>
    <div class="wk">${wk}</div><div class="grid">${cells}</div>`;
}

function sashaReply(message) {
  const q = String(message || '').toLowerCase();
  const styles = S.styles || [];
  const tasks = S.tasks.map(t => ({t,d:nextOcc(t)})).filter(x => x.d).sort((a,b)=>a.d.localeCompare(b.d));
  const missing = styles.flatMap(st => st.items.filter(i=>!i.have).map(i=>({name:i.name,style:st.name})));
  const wash = styles.find(s => /wash day/i.test(s.name));
  const dateLabel = d => fmtDate(d);
  if (/goal/.test(q)) {
    return `Let’s make your hair goal doable, not overwhelming. 🤎 Pick one focus for the next four weeks: (1) retain length by reducing breakage, (2) keep your scalp comfortable, (3) get consistent with wash day, or (4) practice a new style. Start with one weekly action and track it in Crown Planner. What matters most to you?`;
  }
  if (/four.week|4.week|month plan/.test(q)) {
    const picks = styles.filter(s=>!/wash day/i.test(s.name)).slice(0,3);
    const washLine = wash ? `Wash-day foundation: ${wash.name} — ${wash.steps.slice(0,3).map(x=>x.text).join('; ')}.` : 'Add a Wash Day style in Styles so your plan can use your own steps.';
    return `Your flexible four-week starter plan 📆\n\nWEEK 1 · Reset: ${washLine}\n\nWEEK 2 · Style: choose ${picks[0]?.name || 'a low-manipulation style'} and block enough time for installation.\n\nWEEK 3 · Maintain: check scalp comfort, moisturize as needed, and refresh only where needed.\n\nWEEK 4 · Review: plan a gentle take-down or refresh based on your style’s condition; schedule wash day afterward if appropriate.\n\nYour saved looks to consider: ${picks.map(s=>s.name).join(', ') || 'add a few styles to your library'}. This is a suggested outline, not automatically added to your calendar.`;
  }
  if (/wash|detangl|deep condition|between wash/.test(q)) {
    const steps = wash?.steps?.length ? wash.steps.map((x,i)=>`${i+1}. ${x.text}`).join('\n') : '1. Detangle gently in sections\n2. Cleanse the scalp\n3. Condition and detangle\n4. Apply leave-in and style\n5. Allow enough drying time.';
    return `Let’s make wash day realistic, babe. 🫧 Your saved wash-day steps are:\n${steps}\n\nBlock time for the steps that need your attention, and keep drying time separate if you’re air-drying. Check your Wash Day Reset entry in Styles to update products and tools. I can suggest a schedule here, but I haven’t added calendar events.`;
  }
  if (/choose|pick a style|which style|style from|style idea|low.manipulation|recommend a style|next style/.test(q)) {
    const looks = styles.filter(s=>!/wash day/i.test(s.name)).slice(0,6);
    return looks.length ? `Let’s start with the looks you’ve actually saved. 👑\n\n${looks.map(s=>`• ${s.emoji || '✨'} ${s.name}${s.notes ? ' — '+s.notes : ''}`).join('\n')}\n\nQuick rule: choose based on the time you have, how much maintenance you want, and whether your hair is already prepped. For a low-manipulation option, avoid installing too tightly and keep your scalp comfortable.` : 'First, add a few looks in Styles. Then I can help you compare the options you saved.' ;
  }
  if (/week|schedule|calendar|busy|time|routine/.test(q)) {
    const list = tasks.slice(0,8);
    const lines = list.length ? list.map(({t,d})=>`• ${dateLabel(d)} — ${t.title}${t.time ? ' at '+t.time : ''}`).join('\n') : '• No upcoming hair tasks saved yet.';
    return `Let’s protect your time instead of pretending you have a free afternoon. 🗓️ Here’s what Crown Planner shows next:\n${lines}\n\nTry spacing demanding tasks apart: prep or detangle first, installation on the day(s) you can focus, and maintenance in short blocks. These are planner tasks only—not a live read of Google Calendar.`;
  }
  if (/missing|product|tool|shopping|buy|supply|supplies/.test(q)) {
    return missing.length ? `Here’s what you’ve marked as still needed across your saved looks:\n${[...new Set(missing.map(x=>x.name+' ('+x.style+')'))].slice(0,18).map(x=>'• '+x).join('\n')}\n\nCheck your stash before buying duplicates. Mark items as owned in the relevant style to keep this list current.` : 'Your saved looks don’t show any missing items right now. Either you’re stocked, or we need to add products and tools to the style you’re planning. 💋';
  }
  if (/how long|wear|take down|duration|refresh/.test(q)) {
    const looks=styles.filter(s=>!/wash day/i.test(s.name)).slice(0,6);
    return `Wear time depends on the style, installation tension, scalp comfort, and how it holds up. Don’t keep a style in just to reach a target date—take it down sooner if you notice pain, persistent itching, breakage, or scalp irritation.\n\nYour saved style library includes: ${looks.map(s=>s.name).join(', ') || 'no styles yet'}. Add the planned wear duration in Plan this style to schedule a reminder.`;
  }
  return `I can help with your saved Crown Planner information right now. Try asking me to plan wash day, recommend a saved style, build a weekly routine, make a four-week outline, check missing supplies, or discuss wear time.\n\nI’m currently a local preview—not a live AI assistant—so I won’t pretend to know hair details you haven’t provided or that I’ve synced your calendar.`;
}
function addSashaMessage(text, who) {
  const box = $('#sashaChat'); if (!box) return;
  const node = document.createElement('div'); node.className = `sasha-msg ${who}`; node.textContent = text;
  box.appendChild(node); box.scrollTop = box.scrollHeight;
}
function sendSasha(message) {
  const text = String(message || '').trim(); if (!text) return;
  addSashaMessage(text, 'user');
  window.setTimeout(() => addSashaMessage(sashaReply(text), 'bot'), 180);
}

/* ---------- forms in sheets ---------- */
function styleForm(s) {
  const cur = s ? s.emoji : EMOJIS[0];
  return `<form data-form="style" data-id="${s ? s.id : ''}">
    <div class="sheet-head"><h3 class="script">${s ? 'Edit style' : 'New style'}</h3><button type="button" class="x" data-act="close-sheet">✕</button></div>
    <label class="fld"><span>Style name</span><input name="name" required value="${esc(s ? s.name : '')}" placeholder="Goddess locs, wash & go, bun…"></label>
    <div class="fld"><span>Pick a charm</span><div class="emojis">${EMOJIS.map(e => `<label class="emo"><input type="radio" name="emoji" value="${e}" ${e === cur ? 'checked' : ''}><span>${e}</span></label>`).join('')}</div></div>
    <label class="fld"><span>Notes</span><textarea name="notes" rows="3" placeholder="Length, size, who does it, price…">${esc(s ? s.notes : '')}</textarea></label>
    <div class="sheet-actions"><button class="btn gold">Save ✦</button></div>
  </form>`;
}

function taskForm(t, p = {}) {
  const isNew = !t;
  t = t || { id: '', title: p.title || '', date: p.date || ui.day, allDay: false, time: '10:00', duration: p.duration || 60, repeat: 'none', reminder: 60, notes: '', styleId: p.styleId || '', sync: !!S.settings.clientId && S.settings.autoSync };
  const opt = (v, l, sel) => `<option value="${v}" ${sel ? 'selected' : ''}>${l}</option>`;
  const styleOpts = opt('', '— none —', !t.styleId) + S.styles.map(s => opt(s.id, `${esc(s.emoji)} ${esc(s.name)}`, s.id === t.styleId)).join('');
  const durs = DURS.concat(DURS.includes(t.duration) ? [] : [t.duration]).sort((a, b) => a - b);
  return `<form data-form="task" data-id="${t.id}">
    <div class="sheet-head"><h3 class="script">${isNew ? 'New task' : 'Edit task'}</h3><button type="button" class="x" data-act="close-sheet">✕</button></div>
    <label class="fld"><span>What</span><input name="title" required value="${esc(t.title)}" placeholder="Wash day, install, trim…"></label>
    <div class="row2">
      <label class="fld"><span>Date</span><input type="date" name="date" required value="${t.date}"></label>
      <label class="fld"><span>Style</span><select name="styleId">${styleOpts}</select></label>
    </div>
    <label class="switch"><input type="checkbox" name="allDay" ${t.allDay ? 'checked' : ''} data-change="allday"><span class="track"></span> All day</label>
    <div class="row2 timefields" ${t.allDay ? 'hidden' : ''}>
      <label class="fld"><span>Start</span><input type="time" name="time" value="${t.time || '10:00'}"></label>
      <label class="fld"><span>How long</span><select name="duration">${durs.map(d => opt(d, fmtDur(d), d === t.duration)).join('')}</select></label>
    </div>
    <div class="row2">
      <label class="fld"><span>Repeat</span><select name="repeat">${Object.entries(REPEATS).map(([k, r]) => opt(k, r.label, k === t.repeat)).join('')}</select></label>
      <label class="fld"><span>Reminder</span><select name="reminder">${REMINDERS.map(([v, l]) => opt(v, l, v === t.reminder)).join('')}</select></label>
    </div>
    <label class="fld"><span>Notes</span><textarea name="notes" rows="2">${esc(t.notes)}</textarea></label>
    ${S.settings.clientId ? `<label class="switch"><input type="checkbox" name="sync" ${t.sync ? 'checked' : ''}><span class="track"></span> Also add to Google Calendar</label>` : '<p class="hint">Saved only in Crown Planner — no Google setup needed. Connect Google later if you want calendar syncing 💎</p>'}
    ${t.gLink ? `<p class="hint"><a href="${esc(t.gLink)}" target="_blank" rel="noopener">Open in Google Calendar ↗</a></p>` : ''}
    <div class="sheet-actions">
      ${!isNew ? `<button type="button" class="btn ghost danger" data-act="del-task" data-id="${t.id}">Delete</button>` : ''}
      <button class="btn gold">Save ✦</button>
    </div>
  </form>`;
}

     `<img src="${photoByStyle(s.name)}" alt="" onerror="this.style.display='none'">`;
  const sel = (n, list, d) => `<select name="${n}">${list.map(([v, l]) => `<option value="${v}" ${String(v) === String(d) ? 'selected' : ''}>${l}</option>`).join('')}</select>`;
  const hrs = [1, 2, 3, 4, 5, 6, 7, 8, 10].map(h => [h, `${h} hr${h > 1 ? 's' : ''}`]);
  const ck = (n, label, sub, on = false) => `<label class="switch"><input type="checkbox" name="${n}" ${on ? 'checked' : ''}><span class="track"></span><span>${label}<span class="sub" style="display:block;font-size:12px;color:var(--ink-soft);font-weight:500">${sub}</span></span></label>`;

    <div class="planner-style-summary">${photo}<div><strong>${esc(s.name)}</strong><p>${esc(s.notes || 'Your next look, planned around your time.')}</p></div></div>
    <section class="planner-form-section">
      <h4>♧ &nbsp; Styling duration <span>(to complete the style)</span></h4>
      <label class="fld"><span>How many days will it take?</span><div class="stepper"><button type="button" data-act="number-step" data-target="styleDays" data-step="-1">−</button><input name="styleDays" type="number" min="1" max="14" step="1" value="1" required><button type="button" data-act="number-step" data-target="styleDays" data-step="1">＋</button><em>days</em></div></label>
      <label class="fld"><span>How many hours per day?</span><div class="stepper"><button type="button" data-act="number-step" data-target="hours" data-step="-1">−</button><input name="hours" type="number" min="1" max="10" step="1" value="${added ? 6 : 2}" required><button type="button" data-act="number-step" data-target="hours" data-step="1">＋</button><em>hours</em></div></label>
      <p class="planner-note">▦ &nbsp; This creates separate styling sessions on consecutive days. You can adjust your tasks after adding them.</p>
    </section>
    <section class="planner-form-section">
      <h4>◷ &nbsp; How long will you wear it?</h4>
      <div class="wear-row"><div class="stepper"><button type="button" data-act="number-step" data-target="wearLength" data-step="-1">−</button><input name="wearLength" type="number" min="1" max="365" step="1" value="4" required><button type="button" data-act="number-step" data-target="wearLength" data-step="1">＋</button></div>${sel('wearUnit', [['days','Days'],['weeks','Weeks'],['months','Months']], 'weeks')}</div>
    </section>
    <section class="planner-form-section">
      <h4>▦ &nbsp; Start date</h4>
      <label class="fld"><input type="date" name="date" required value="${def}"></label>
    </section>
    <section class="planner-form-section">
      <h4>▦ &nbsp; Add to calendar</h4>
      <label class="switch"><input type="checkbox" name="install" checked><span class="track"></span><span>Save styling sessions in Crown Planner</span></label>
      <label class="switch"><input type="checkbox" name="wash"><span class="track"></span><span>Include wash day</span></label>
      <label class="switch"><input type="checkbox" name="shop"><span class="track"></span><span>Include a supply run</span></label>
      <label class="switch"><input type="checkbox" name="refresh" checked><span class="track"></span><span>Schedule a mid-way refresh</span></label>
      <label class="switch"><input type="checkbox" name="takedown" checked><span class="track"></span><span>Schedule take-down</span></label>
      <label class="switch"><input type="checkbox" name="sync" ${S.settings.clientId ? 'checked' : ''}><span class="track"></span><span>Also add to Google Calendar <small class="optional-label">(optional)</small></span></label>
    </section>
    <input type="hidden" name="styleOffset" value="0">
    <input type="hidden" name="washTime" value="09:00">
    <input type="hidden" name="time" value="10:00">
    <input type="hidden" name="washHours" value="4">
    <input type="hidden" name="washStyle" value="">
    <div class="sheet-actions"><button class="btn gold block">Add to Plan</button></div>
  </form>`;
}

function openSheet(html) {
  $('#sheetBody').innerHTML = html;
  const w = $('#sheet'); w.hidden = false;
  requestAnimationFrame(() => w.classList.add('open'));
  $('.sheet').scrollTop = 0;
  hydrate();
}
function closeSheet() {
  const w = $('#sheet'); w.classList.remove('open');
  setTimeout(() => { if (!w.classList.contains('open')) { w.hidden = true; $('#sheetBody').innerHTML = ''; } }, 260);
}
let toastTimer;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}
const go = () => window.scrollTo({ top: 0 });

function addMissingToList(s) {
  let n = 0;
  for (const i of s.items) {
    if (i.have || S.shopping.some(x => x.styleItemId === i.id && !x.done)) continue;
    S.shopping.push({ id: uid(), name: i.name, cat: i.cat, done: false, styleId: s.id, styleItemId: i.id }); n++;
  }
  save();
  return n;
}

/* ---------- actions ---------- */
const ACT = {
  'tab': el => { ui.tab = el.dataset.id; ui.styleId = null; render(); go(); },
  'open-style': el => { ui.styleId = el.dataset.id; render(); go(); },
  'back-styles': () => { ui.styleId = null; render(); go(); },
  'new-style': () => openSheet(styleForm()),
  'edit-style': el => openSheet(styleForm(getStyle(el.dataset.id))),
  'del-style': el => {
    const s = getStyle(el.dataset.id); if (!s || !confirm(`Delete “${s.name}”? Its photos go too.`)) return;
    s.inspo.forEach(p => DB.del(p).catch(() => {}));
    S.styles = S.styles.filter(x => x !== s);
    S.tasks.forEach(t => { if (t.styleId === s.id) t.styleId = ''; });
    S.shopping.forEach(i => { if (i.styleId === s.id) { i.styleId = ''; i.styleItemId = ''; } });
    save(); ui.styleId = null; render(); go(); toast('Style deleted');
  },
  'toggle-have': el => {
    const s = getStyle(el.dataset.sid), i = s && s.items.find(x => x.id === el.dataset.id); if (!i) return;
    i.have = !i.have;
    S.shopping.forEach(x => { if (x.styleItemId === i.id) x.done = i.have; });
    save(); render();
  },
  'del-item': el => { const s = getStyle(el.dataset.sid); if (!s) return; s.items = s.items.filter(x => x.id !== el.dataset.id); save(); render(); },
  'missing-to-list': el => { const n = addMissingToList(getStyle(el.dataset.id)); toast(n ? `${n} added to your list 🛍️` : 'Already on your list 💖'); render(); },
  'del-step': el => { const s = getStyle(el.dataset.sid); s.steps = s.steps.filter(x => x.id !== el.dataset.id); save(); render(); },
  'step-up': el => {
    const s = getStyle(el.dataset.sid); const i = s.steps.findIndex(x => x.id === el.dataset.id);
    if (i > 0) { [s.steps[i - 1], s.steps[i]] = [s.steps[i], s.steps[i - 1]]; save(); render(); }
  },
  'view-photo': el => openSheet(`<div class="viewer">
      <div class="sheet-head"><h3 class="script">Inspo</h3><button type="button" class="x" data-act="close-sheet">✕</button></div>
      <img data-photo="${esc(el.dataset.id)}" alt="Inspo">
      <div class="sheet-actions"><button class="btn ghost danger" data-act="del-photo" data-sid="${el.dataset.sid}" data-id="${esc(el.dataset.id)}">Delete photo</button>
      <button class="btn" data-act="cover-photo" data-sid="${el.dataset.sid}" data-id="${esc(el.dataset.id)}">Make cover</button></div></div>`),
  'del-photo': el => {
    const s = getStyle(el.dataset.sid); s.inspo = s.inspo.filter(p => p !== el.dataset.id);
    DB.del(el.dataset.id).catch(() => {}); photoCache.delete(el.dataset.id); save(); closeSheet(); render();
  },
  'cover-photo': el => {
    const s = getStyle(el.dataset.sid); s.inspo = [el.dataset.id, ...s.inspo.filter(p => p !== el.dataset.id)];
    save(); closeSheet(); render(); toast('New cover pic ✨');
  },
  'play-video': el => {
    const fr = el.closest('.vframe');
    fr.innerHTML = `<iframe src="${esc(fr.dataset.embed)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen; clipboard-write" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" title="Video"></iframe>`;
  },
  'del-video': el => { const s = getStyle(el.dataset.sid); s.videos = s.videos.filter(v => v.id !== el.dataset.id); save(); render(); },
  'plan-style': el => openSheet(wizardForm(getStyle(el.dataset.id))),
  'sasha-prompt': el => sendSasha(el.dataset.prompt),
  'add-task': el => openSheet(taskForm(null, { date: ui.tab === 'plan' ? ui.day : today(), styleId: el.dataset.style || '' })),
  'template': el => openSheet(taskForm(null, { date: ui.day, title: el.dataset.title, duration: +el.dataset.dur })),
  'edit-task': el => openSheet(taskForm(getTask(el.dataset.id))),
  'del-task': el => {
    const t = getTask(el.dataset.id); if (!t || !confirm(`Delete “${t.title}”${t.repeat !== 'none' ? ' and all its repeats' : ''}?`)) return;
    S.tasks = S.tasks.filter(x => x !== t); save(); closeSheet(); render();
    if (t.gEventId && S.settings.clientId) unsyncTask(t, false);
  },
  'toggle-done': el => {
    const t = getTask(el.dataset.id); const d = el.dataset.date; t.doneDates = t.doneDates || [];
    if (isDone(t, d)) t.doneDates = t.doneDates.filter(x => x !== d); else { t.doneDates.push(d); toast('Slayed ✨'); }
    save(); render();
  },
  'pick-day': el => { ui.day = el.dataset.id; ui.month = ui.day.slice(0, 7); render(); },
  'cal-prev': () => { const [y, m] = ui.month.split('-').map(Number); ui.month = dstr(new Date(y, m - 2, 1)).slice(0, 7); render(); },
  'cal-next': () => { const [y, m] = ui.month.split('-').map(Number); ui.month = dstr(new Date(y, m, 1)).slice(0, 7); render(); },
  'shop-toggle': el => {
    const i = S.shopping.find(x => x.id === el.dataset.id); i.done = !i.done;
    const s = getStyle(i.styleId); const si = s && s.items.find(x => x.id === i.styleItemId); if (si) si.have = i.done;
    save(); render();
  },
  'shop-del': el => { S.shopping = S.shopping.filter(x => x.id !== el.dataset.id); save(); render(); },
  'shop-clear': () => { S.shopping = S.shopping.filter(x => !x.done); save(); render(); },
  'shop-from-style': () => openSheet(`<div class="sheet-head"><h3 class="script">Which look?</h3><button type="button" class="x" data-act="close-sheet">✕</button></div>
      ${S.styles.map(s => `<button class="pick" data-act="shop-pick-style" data-id="${s.id}"><b>${esc(s.emoji)}</b><span>${esc(s.name)}<span class="sub" style="display:block;font-size:12px;color:var(--ink-soft);font-weight:500">${s.items.filter(i => !i.have).length} missing</span></span></button>`).join('')}`),
  'shop-pick-style': el => { const n = addMissingToList(getStyle(el.dataset.id)); closeSheet(); render(); toast(n ? `${n} added 🛍️` : 'Nothing missing 💖'); },
  'g-connect': () => getToken().then(() => { toast('Google Calendar connected ✨'); render(); }).catch(e => toast(e.message)),
  'g-disconnect': () => {
    if (tok && gisLoaded()) google.accounts.oauth2.revoke(tok, () => {});
    tok = null; tokExp = 0; S.settings.gLinked = false; save();
    try { sessionStorage.removeItem('cp.tok'); } catch (e) {}
    render(); toast('Disconnected');
  },
  'g-sync-all': () => {
    const list = S.tasks.filter(t => !t.gEventId);
    if (!list.length) return toast('Everything is already on Google 💎');
    list.forEach(t => t.sync = true); save();
    syncMany(list);
  },
  'export': async () => {
    const photos = {};
    for (const s of S.styles) for (const p of s.inspo) { try { const v = photoCache.get(p) || await DB.get(p); if (v) photos[p] = v; } catch (e) {} }
    const blob = new Blob([JSON.stringify({ ...S, photos })], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `crown-planner-backup-${today()}.json`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast('Backup saved 💾');
  },
  'reset': () => {
    if (!confirm('Erase all styles, lists and tasks on this device?')) return;
    S.styles.forEach(s => s.inspo.forEach(p => DB.del(p).catch(() => {})));
    const keep = { clientId: S.settings.clientId, calendarId: S.settings.calendarId, autoSync: S.settings.autoSync, gLinked: S.settings.gLinked };
    S = blank(); S.settings = Object.assign(S.settings, keep); save(); ui.styleId = null; ui.tab = 'styles'; render(); go(); toast('Fresh start ✨');
  },
  'starters': () => {
    const have = new Set(S.styles.map(s => s.name));
    const add = seed().styles.filter(s => !have.has(s.name));
    S.styles.push(...add); save(); ui.tab = 'styles'; ui.styleId = null; render(); go();
    toast(add.length ? `${add.length} starter looks added 🌀` : 'Starter looks are already here');
  },
  'close-sheet': () => closeSheet()
};

const FORMS = {
  'style': (f, fd) => {
    const name = fd.get('name').trim(); if (!name) return;
    let s = getStyle(f.dataset.id);
    if (!s) { s = { id: uid(), items: [], steps: [], inspo: [], videos: [] }; S.styles.unshift(s); }
    Object.assign(s, { name, emoji: fd.get('emoji') || '💫', notes: fd.get('notes').trim() });
    save(); closeSheet(); ui.tab = 'styles'; ui.styleId = s.id; render(); go();
  },
  'add-item': (f, fd) => {
    const s = getStyle(f.dataset.sid); const name = fd.get('name').trim(); if (!name) return;
    s.items.push({ id: uid(), name, cat: fd.get('cat'), have: false }); save(); render();
    const inp = document.querySelector(`form[data-form="add-item"] input[name=name]`); if (inp) inp.focus();
  },
  'add-step': (f, fd) => {
    const s = getStyle(f.dataset.sid); const text = fd.get('text').trim(); if (!text) return;
    s.steps.push({ id: uid(), text }); save(); render();
    const inp = document.querySelector(`form[data-form="add-step"] input[name=text]`); if (inp) inp.focus();
  },
  'add-video': (f, fd) => {
    const s = getStyle(f.dataset.sid); const p = parseVideo(fd.get('url'));
    if (!p) return toast('That link doesn’t look right — paste the full https:// link');
    s.videos.push({ id: uid(), url: p.url, title: fd.get('title').trim() }); save(); render();
    toast(p.embed ? 'Tutorial saved ▶' : 'Link saved ↗');
  },
  'shop-add': (f, fd) => {
    const name = fd.get('name').trim(); if (!name) return;
    S.shopping.push({ id: uid(), name, cat: fd.get('cat'), done: false, styleId: '', styleItemId: '' }); save(); render();
    const inp = document.querySelector(`form[data-form="shop-add"] input[name=name]`); if (inp) inp.focus();
  },
  'task': (f, fd) => {
    let t = getTask(f.dataset.id);
    const data = {
      title: fd.get('title').trim(), date: fd.get('date'), styleId: fd.get('styleId') || '', allDay: fd.get('allDay') === 'on',
      time: fd.get('time') || '10:00', duration: +fd.get('duration') || 60, repeat: fd.get('repeat') || 'none',
      reminder: +fd.get('reminder'), notes: fd.get('notes').trim(), sync: fd.get('sync') === 'on'
    };
    if (!data.title || !data.date) return;
    if (!t) { t = { id: uid(), doneDates: [] }; S.tasks.push(t); }
    Object.assign(t, data); save(); closeSheet();
    if (ui.tab === 'plan') { ui.day = t.date; ui.month = t.date.slice(0, 7); }
    render();
    if (t.sync && S.settings.clientId) syncTask(t);
    else if (!t.sync && t.gEventId && S.settings.clientId) unsyncTask(t);
    else toast('Saved ✨');
  },
  'wizard': (f, fd) => {
    const s = getStyle(f.dataset.id); const date = fd.get('date'); if (!s || !date) return;
    const wearLength = Math.max(1, Math.min(365, +fd.get('wearLength') || 3));
    const wearUnit = fd.get('wearUnit') || 'weeks';
    const wearDays = wearLength * (wearUnit === 'days' ? 1 : wearUnit === 'months' ? 30 : 7);
    const sync = fd.get('sync') === 'on';
    const styleDay = addDays(date, +fd.get('styleOffset') || 0);
    const ws = getStyle(fd.get('washStyle'));
    const list = x => x.steps.map((st, i) => `${i + 1}. ${st.text}`).join('\n');
    const missingOf = x => x ? x.items.filter(i => !i.have).map(i => '• ' + i.name) : [];
    const missing = [...new Set([...missingOf(ws), ...missingOf(s)])].join('\n');
    const mk = o => ({ id: uid(), doneDates: [], styleId: s.id, repeat: 'none', allDay: false, time: '10:00', duration: 60, reminder: 60, notes: '', sync, ...o });
    const out = [];
    if (fd.get('shop') === 'on') out.push(mk({ title: `Supply run for ${s.name} 🛍️`, date: addDays(date, -3), allDay: true, reminder: -1, notes: missing ? 'Still need:\n' + missing : 'You have everything 💖' }));
    if (fd.get('wash') === 'on') out.push(mk({ title: `Wash day for ${s.name} 🫧`, date, time: fd.get('washTime') || '09:00', duration: (+fd.get('washHours') || 4) * 60, notes: ws && ws.steps.length ? list(ws) : '' }));
    if (fd.get('install') === 'on') {
      const styleDays = Math.max(1, Math.min(14, +fd.get('styleDays') || 1));
      for (let day = 0; day < styleDays; day++) {
        out.push(mk({
          title: styleDays === 1 ? `${s.name} style day 🌀` : `${s.name} styling — day ${day + 1} of ${styleDays} 🌀`,
          date: addDays(styleDay, day),
          time: fd.get('time') || '10:00',
          duration: (+fd.get('hours') || 2) * 60,
          notes: (list(s) ? list(s) + '\\n\\n' : '') + (styleDays > 1 ? `Styling session ${day + 1} of ${styleDays}. Mark this session complete when finished.` : '')
        }));
      }
    }
    if (wearDays >= 2 && fd.get('refresh') === 'on') out.push(mk({ title: `${s.name} refresh ✨`, date: addDays(styleDay, Math.max(1, Math.round(wearDays / 2))), allDay: true, reminder: -1, notes: 'Edges, scalp care, re-twist as needed.' }));
    if (fd.get('takedown') === 'on') out.push(mk({ title: `Take down ${s.name} 🪮`, date: addDays(styleDay, wearDays), duration: 120, notes: 'Take down gently, then plan the next wash day.' }));
    if (!out.length) return toast('Pick at least one thing to add');
    S.tasks.push(...out); save(); closeSheet(); render();
    toast(`${out.length} tasks planned ✨`);
    if (sync && S.settings.clientId) syncMany(out);
  },
  'sasha-chat': (f, fd) => { const input = f.elements.message; sendSasha(input.value); input.value = ''; },
  'settings-g': (f, fd) => {
    const cid = fd.get('clientId').trim();
    if (cid !== S.settings.clientId) { tok = null; S.settings.gLinked = false; try { sessionStorage.removeItem('cp.tok'); } catch (e) {} }
    S.settings.clientId = cid;
    S.settings.calendarId = fd.get('calendarId').trim() || 'primary';
    S.settings.autoSync = fd.get('autoSync') === 'on';
    save(); render(); toast('Saved 💎');
  }
};

const CHG = {
  'allday': el => { const tf = el.form.querySelector('.timefields'); if (tf) tf.hidden = el.checked; },
  'add-photos': async el => {
    const s = getStyle(el.dataset.sid); const files = [...el.files]; if (!files.length) return;
    toast('Adding pics…');
    let n = 0;
    for (const f of files) {
      try { const data = await fileToDataURL(f); const id = 'p_' + uid(); await DB.put(id, data); photoCache.set(id, data); s.inspo.push(id); n++; }
      catch (e) { toast(e.message); }
    }
    save(); render(); if (n) toast(`${n} pic${n > 1 ? 's' : ''} added 📸`);
  },
  'import-file': async el => {
    const f = el.files[0]; if (!f) return;
    try {
      const d = JSON.parse(await f.text());
      if (!d || !Array.isArray(d.styles) || !Array.isArray(d.tasks)) throw new Error('bad');
      if (!confirm('Replace what’s on this phone with this backup?')) return;
      const photos = d.photos || {}; delete d.photos;
      for (const [k, v] of Object.entries(photos)) { await DB.put(k, v); photoCache.set(k, v); }
      S = Object.assign(blank(), d, { settings: Object.assign(blank().settings, S.settings, d.settings || {}) });
      save(); ui.styleId = null; render(); toast('Backup restored ✨');
    } catch (e) { toast('That file isn’t a Crown Planner backup'); }
    el.value = '';
  }
};

document.addEventListener('click', e => {
  if (e.target.id === 'sheet') return closeSheet();
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACT[el.dataset.act]; if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener('input', e => {
  const el = e.target.closest('[data-style-search]');
  if (!el) return;
  const pos = el.selectionStart;
  ui.styleQuery = el.value;
  const view = $('#view');
  const active = document.activeElement;
  const next = viewStyles();
  // Replace only the library content while preserving keyboard focus and cursor.
  view.innerHTML = next;
  const input = view.querySelector('[data-style-search]');
  if (input) { input.focus(); input.setSelectionRange(pos, pos); }
  hydrate();
});
document.addEventListener('submit', e => {
  const f = e.target; const fn = FORMS[f.dataset.form];
  if (fn) { e.preventDefault(); fn(f, new FormData(f)); }
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-change]'); if (el && CHG[el.dataset.change]) CHG[el.dataset.change](el);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet(); });

/* sparkles */
const sp = $('.sparkles');
for (let i = 0; i < 16; i++) {
  const s = document.createElement('span'); s.textContent = i % 3 ? '✦' : '✧';
  s.style.cssText = `left:${Math.random() * 100}%;top:${Math.random() * 100}%;font-size:${8 + Math.random() * 14}px;animation-delay:${(Math.random() * 3.6).toFixed(2)}s;animation-duration:${(3 + Math.random() * 3).toFixed(2)}s`;
  sp.appendChild(s);
}

if (!localStorage.getItem(KEY)) save();
render();
})();
</script>
</body>
</html>
